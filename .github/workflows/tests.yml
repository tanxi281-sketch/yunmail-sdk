name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned to 24.04: setup-python cannot install Python 3.9 on the
    # Ubuntu 26.04 runner, which broke the 3.9 matrix job.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
