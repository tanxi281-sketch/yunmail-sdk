name: publish

# Publishes the package to PyPI via Trusted Publishing (OIDC) whenever a
# GitHub Release is published. No PyPI password or API token is stored
# anywhere: PyPI verifies the release comes from this repository/workflow.
# One-time setup on PyPI: add a "pending" trusted publisher for project
# "yunmail" -> owner tanxi281-sketch, repo yunmail-sdk, workflow publish.yml.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
